name: Redémarrage périodique du bot

# Ce workflow tourne sur un runner GitHub classique (pas besoin de ta
# machine pour celui-ci) : son seul rôle est d'annuler puis relancer le
# workflow principal "Discord Film Bot" avant que GitHub ne le coupe
# automatiquement au bout de 35 jours d'exécution continue.
#
# Toutes les semaines, c'est largement suffisant comme marge de sécurité.
on:
  schedule:
    - cron: "0 3 * * 1" # chaque lundi à 03h00 UTC
  workflow_dispatch: # permet aussi de le déclencher manuellement pour tester

permissions:
  actions: write # nécessaire pour pouvoir annuler / relancer un workflow

jobs:
  restart-bot-workflow:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # fourni automatiquement par GitHub
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Annuler l'exécution en cours du bot (s'il y en a une)
        run: |
          RUN_ID=$(gh run list --workflow=bot.yml --status=in_progress --limit=1 --json databaseId --jq '.[0].databaseId')

          if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
            echo "Run en cours trouvé (id: $RUN_ID), annulation..."
            gh run cancel "$RUN_ID"
            # On laisse le temps au job de bien s'arrêter côté runner
            # avant de relancer un nouveau run.
            sleep 20
          else
            echo "Aucun run en cours pour bot.yml, rien à annuler."
          fi

      - name: Relancer le workflow du bot
        run: |
          echo "Déclenchement d'un nouveau run de bot.yml..."
          gh workflow run bot.yml

      - name: Vérifier que le nouveau run a bien démarré
        run: |
          sleep 15
          gh run list --workflow=bot.yml --limit=3
